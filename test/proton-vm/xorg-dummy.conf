# A virtual X server with a real refresh rate for the game runs of dev docs: proton-vm/
# (Xvfb reports 0 Hz, and a Unity player then spins forever in its frame pacing right after
# QueryDisplayConfig). Start it in the container, as any user, without a GPU:
#   Xorg :8 -config test/proton-vm/xorg-dummy.conf -noreset -nolisten tcp -logfile /tmp/xorg8.log &
# run-game.sh -d :8 ... then uses it (xdotool, xwd and the vsock X relay of saguaro-vm work the same).
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "dummy"
    Driver "dummy"
    VideoRam 262144
EndSection

Section "Monitor"
    Identifier "monitor"
    HorizSync 28.0-80.0
    VertRefresh 48.0-75.0
    # 1280x720 at 60 Hz and 1920x1080 at 60 Hz (CVT)
    Modeline "1280x720_60.00" 74.50 1280 1344 1472 1664 720 723 728 748 -hsync +vsync
    Modeline "1920x1080_60.00" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
EndSection

Section "Screen"
    Identifier "screen"
    Device "dummy"
    Monitor "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720_60.00" "1920x1080_60.00"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen "screen"
EndSection
