#
# Failures that test/quick.sh reports as "known-fail" instead of "fail" (a known failure does not fail the run).
# Matching is exact (test/quick/report.py): an entry applies only when ALL of its fields match.
#   variants  list of variants (direct vm sev sev-snp sgx vbs tdx)            required
#   test      the pytest id <class>::<test>, or for an example the name that exec.sh prints in its [FAIL] line
#             (for example unit_tests-mremap), or the step name for a step that is not pytest              required
#   arch      architecture (x86_64, aarch64, riscv64), string or list                                      optional
#   vcpus     vCPU count (string or list)                                                                  optional
#   step      step name (see `test/quick.sh <variant> --list`)                                              optional
#   reason    why it fails; an entry without a cause that is understood is not allowed                      required
# libos/test/regression/vm_skip.toml (skips and xfails under the VM PAL) is separate and unchanged.
# A test that is too slow or hangs on one host is not listed here but left out of the run with QUICK_PYTEST_K in the
# workflow (see .github/workflows/*.yml and test/README.md).
# `python3 test/quick/check-core-list.py` checks that the libos entries name existing tests.

