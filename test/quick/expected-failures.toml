variants = ["vm", "sev", "sev-snp"]
vcpus = 1
test = "TC_00_Unittests::test_000_spinlock"
reason = "fails at 1 vCPU (measured under saguaro-vm on x86_64 and under SNP); tier 1 runs at 2 vCPUs, so only the extended sweep meets it"

