# Tests that do not apply to / do not yet pass on the VM PAL (applied by conftest.py when GRAMINE_VM=1).
# kind = skip: platform limitation; kind = xfail: known failure, cause not yet understood.
# Test ids are <class>::<method>.

[[group]]
kind = "skip"
category = "fork-exec"
reason = "The VM PAL is single-process (no PalProcessCreate / IPC): the test needs fork, vfork, execve, clone without CLONE_VM, a child process, or a pipe/socket/eventfd/futex shared with one."
tests = [
  "TC_01_Bootstrap::test_010_console",
  "TC_01_Bootstrap::test_202_fork_and_exec",
  "TC_01_Bootstrap::test_203_fork_disallowed",
  "TC_01_Bootstrap::test_2045_fork_pacret",
  "TC_01_Bootstrap::test_204_vfork_and_exec",
  "TC_01_Bootstrap::test_205_exec_fork",
  "TC_01_Bootstrap::test_206_double_fork",
  "TC_01_Bootstrap::test_220_send_handle",
  "TC_01_Bootstrap::test_221_send_handle_pf",
  "TC_01_Bootstrap::test_222_send_handle_enc",
  "TC_01_Bootstrap::test_223_send_handle_tmpfs",
  "TC_01_Bootstrap::test_401_exit_group",
  "TC_01_Bootstrap::test_405_sigprocmask_pending",
  "TC_30_Syscall::test_020_getdents",
  "TC_30_Syscall::test_050_mmap",
  "TC_30_Syscall::test_051_mmap_sgx",
  "TC_30_Syscall::test_057_mprotect_file_fork",
  "TC_30_Syscall::test_071_eventfd_fork",
  "TC_30_Syscall::test_073_eventfd_fork_allowed_failing",
  "TC_30_Syscall::test_090_sighandler_reset",
  "TC_30_Syscall::test_095_kill_all",
  "TC_30_Syscall::test_100_get_set_groups",
  "TC_30_Syscall::test_110_fcntl_lock",
  "TC_30_Syscall::test_111_fcntl_lock_child_only",
  "TC_30_Syscall::test_120_gethostname_default",
  "TC_30_Syscall::test_130_sid",
  "TC_31_Syscall::test_010_syscall_restart",
  "TC_40_FileSystem::test_000_proc",
  "TC_40_FileSystem::test_011_open_opath",
  "TC_40_FileSystem::test_070_shm",
  "TC_50_GDB::test_000_gdb_backtrace",
