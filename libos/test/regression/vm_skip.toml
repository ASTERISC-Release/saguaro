[[group]]
kind = "skip"
category = "no-tcpip"
reason = "The VM PAL has no TCP/UDP/unix-socket stack (vsock only; AF_INET sockets trip an assert in kernel_virtio_vsock.c)."
tests = [
  "TC_80_Socket::test_000_getsockopt",
  "TC_80_Socket::test_060_getsockname",
  "TC_80_Socket::test_305_socket_tcp_einprogress_responsive_poll",
  "TC_80_Socket::test_306_socket_tcp_einprogress_responsive_epoll",
  "TC_80_Socket::test_307_socket_tcp_einprogress_unresponsive_poll",
  "TC_80_Socket::test_308_socket_tcp_einprogress_unresponsive_epoll",
  "TC_80_Socket::test_310_socket_tcp_ipv6_v6only",
  "TC_80_Socket::test_320_socket_ioctl",
]

[[group]]
kind = "skip"
category = "no-dev-streams"
reason = "The VM PAL has no device streams (dev: URIs), so opening /dev/* host devices fails with EBADF."
tests = [
  "TC_40_FileSystem::test_001_devfs",
  "TC_40_FileSystem::test_002_device_passthrough",
  "TC_40_FileSystem::test_080_close_range",
  "TC_80_Socket::test_020_poll",
]

[[group]]
kind = "skip"
category = "no-sysfs"
reason = "The VM PAL does not provide /sys."
tests = [
  "TC_40_FileSystem::test_040_sysfs",
]

[[group]]
kind = "skip"
category = "no-attestation"
reason = "/dev/attestation is not provided by the VM PAL (SGX/TDX only)."
tests = [
  "TC_01_Bootstrap::test_230_keys",
]

[[group]]
kind = "skip"
category = "no-thread-resume"
reason = "_PalThreadResume() is not implemented in the VM PAL (shared with x86), so a thread blocked in a syscall cannot be interrupted by an asynchronous signal (alarm/itimer/kill from another thread/host)."
tests = [
  "TC_01_Bootstrap::test_404_sigterm_multithread",
  "TC_30_Syscall::test_060_sigaltstack",
  "TC_30_Syscall::test_150_itimer",
]

[[group]]
kind = "skip"
category = "no-log-file"
reason = "loader.log_file is not supported by the VM PAL."
tests = [
  "TC_01_Bootstrap::test_701_debug_log_file",
]

[[group]]
kind = "skip"
category = "slow-timer"
reason = "Timed waits are serviced only by CPU0's 100 ms tick (~0.5 s per iteration here), so the test exceeds any sensible timeout. A finer timer would fix it."
tests = [
  "TC_00_Unittests::test_001_rwlock",
]

[[group]]
kind = "skip"
category = "host-environment"
reason = "gramine-vm is a bash launcher (bash rewrites PWD/_/SHLVL in the forwarded environment) and the guest has its own hostname."
tests = [
  "TC_01_Bootstrap::test_103_env_from_host",
  "TC_30_Syscall::test_121_gethostname_pass_etc",
]

[[group]]
kind = "xfail"
category = "investigate"
reason = "Fails with a Bad file descriptor / permission error on a virtiofs file operation; cause not yet understood."
tests = [
  "TC_30_Syscall::test_023_readdir",
  "TC_40_FileSystem::test_030_fdleak",
]

[[group]]
kind = "xfail"
category = "investigate"
reason = "SIGPIPE behaviour differs from direct: the test expects a nonzero exit but the guest exits 0; cause not yet understood."
tests = [
  "TC_30_Syscall::test_092_sighandler_sigpipe",
]

[[group]]
kind = "skip"
category = "large-memory"
reason = "Maps 2 GB and then 4 GB of a file: needs a guest with well over 6 GB of RAM and a page-table pool larger than the VM PAL's fixed 2048 tables (~4 GB of 4 KB mappings)."
tests = [
  "TC_30_Syscall::test_054_large_mmap",
]
