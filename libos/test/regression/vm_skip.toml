# Tests that do not apply to / do not yet pass on the VM PAL (applied by conftest.py when GRAMINE_VM=1).
# kind = skip: platform limitation; kind = xfail: known failure, cause not yet understood.
# Test ids are <class>::<method>. A group may carry `arch = "x86_64"` (or "aarch64"): it then applies only there.

[[group]]
kind = "skip"
category = "fork-exec"
reason = "Still failing with sys.experimental__multiprocess on (the default): the test needs something the VM PAL processes do not provide yet (see dev docs: vm-multiproc/TESTING.md, 2026-10-18)."
tests = [
  "TC_30_Syscall::test_075b_mmap_shared_ro",
  "TC_30_Syscall::test_051_mmap_sgx",
  "TC_40_FileSystem::test_070_shm",
  "TC_50_GDB::test_000_gdb_backtrace",
  "TC_80_Socket::test_010_epoll",
  "TC_80_Socket::test_200_socket_udp",
]

[[group]]
kind = "skip"
category = "vm-socket-ioctl"
reason = "The VM PAL has no guest network interface enumeration; SIOCGIFCONF and SIOCGIFHWADDR are not available."
tests = [
  "TC_80_Socket::test_320_socket_ioctl",
]

[[group]]
kind = "skip"
category = "no-dev-streams"
reason = "The VM PAL has no device streams (dev: URIs), so opening /dev/* host devices fails with EBADF."
tests = [
  "TC_40_FileSystem::test_001_devfs",
  "TC_40_FileSystem::test_002_device_passthrough",
  "TC_40_FileSystem::test_071_memfd_on_shm_mount",
  "TC_40_FileSystem::test_006_device_drm",
  "TC_40_FileSystem::test_007_device_drm_denied",
  "TC_80_Socket::test_005_host_unix_socket",
  "TC_40_FileSystem::test_080_close_range",
  "TC_80_Socket::test_020_poll",
]

[[group]]
kind = "skip"
category = "no-sysfs"
reason = "The VM PAL does not provide /sys."
tests = [
  "TC_40_FileSystem::test_040_sysfs",
]

[[group]]
kind = "skip"
category = "no-thread-resume"
reason = "_PalThreadResume() is not implemented in the VM PAL (shared with x86), so a thread blocked in a syscall cannot be interrupted by an asynchronous signal (alarm/itimer/kill from another thread/host)."
tests = [
  "TC_01_Bootstrap::test_404_sigterm_multithread",
  "TC_30_Syscall::test_060_sigaltstack",
  "TC_30_Syscall::test_150_itimer",
]

[[group]]
kind = "skip"
category = "no-log-file"
reason = "loader.log_file is not supported by the VM PAL."
tests = [
  "TC_01_Bootstrap::test_701_debug_log_file",
]

[[group]]
kind = "skip"
category = "slow-timer"
reason = "Timed waits are serviced only by CPU0's 100 ms tick (~0.5 s per iteration here), so the test exceeds any sensible timeout. A finer timer would fix it."
tests = [
  "TC_00_Unittests::test_001_rwlock",
]

[[group]]
kind = "skip"
category = "host-environment"
reason = "gramine-vm is a bash launcher (bash rewrites PWD/_/SHLVL in the forwarded environment) and the guest has its own hostname."
tests = [
  "TC_01_Bootstrap::test_103_env_from_host",
  "TC_30_Syscall::test_121_gethostname_pass_etc",
]

[[group]]
kind = "xfail"
category = "investigate"
reason = "Fails with a Bad file descriptor / permission error on a virtiofs file operation; cause not yet understood."
tests = [
  "TC_40_FileSystem::test_030_fdleak",
]

[[group]]
kind = "xfail"
category = "investigate"
reason = "readdir fails with 'Bad file descriptor' when run standalone (0/20) but passed inside one full-suite run, so it depends on state/ordering; not caused by the graphics redirection; cause not yet understood."
tests = [
  "TC_30_Syscall::test_023_readdir",
]

[[group]]
kind = "xfail"
category = "investigate"
reason = "Reading a 3000-entry virtiofs directory is slow: it exceeded the 40 s test timeout in one run and passed in another (getdents on virtiofs; related to the readdir xfail)."
tests = [
  "TC_30_Syscall::test_021_getdents_large_dir",
]

[[group]]
kind = "skip"
category = "large-memory"
reason = "Maps 2 GB and then 4 GB of a file: needs a guest with well over 6 GB of RAM and a page-table pool larger than the VM PAL's fixed 2048 tables (~4 GB of 4 KB mappings)."
tests = [
  "TC_30_Syscall::test_054_large_mmap",
]

[[group]]
kind = "skip"
category = "no-svc-rewrite"
reason = "Lazy `svc #0` rewriting (sys.rewrite_syscalls) is a seccomp-trap mechanism of the Linux PAL; the VM PAL dispatches `svc` itself, so there is nothing to rewrite."
tests = [
  "TC_01_Bootstrap::test_603_rewrite_stress",
]

[[group]]
kind = "xfail"
arch = "x86_64"
category = "investigate"
reason = "Fails with 'Internal memory fault with VMA at 0x17ce00' in LibOS (passes on aarch64); cause not yet understood."
tests = [
  "TC_00_Unittests::test_010_gramine_run_test",
]

[[group]]
kind = "skip"
category = "no-cpu-accounting"
reason = "The VM PAL has no CPU-time accounting (PalGetCpuTime is not implemented there): getrusage and times() report zero and the CPU-time clocks fall back to the real-time clock."
tests = [
  "TC_30_Syscall::test_09f_cputime",
]
