# Cross file for building Gramine (direct PAL + LibOS) for 64-bit RISC-V on an x86_64
# build machine. Used by `scripts/install.sh --target riscv64` and by the manual
# `meson setup --cross-file scripts/riscv64/meson-cross.ini` flow inside the riscv64
# cross container (`container/run.sh --target riscv64`); see
# dev docs: riscv/PLAN.md (Phase 1).
#
# The toolchain is Ubuntu's multilib riscv64-linux-gnu cross gcc (gcc-riscv64-linux-gnu,
# GCC 13.3 on the container's Ubuntu 24.04), whose *defaults* are exactly what the port
# targets: -march=rv64imafdc_zicsr_zifencei -mabi=lp64d, and
# -mstack-protector-guard=global (the generic global-canary scheme the top-level
# meson.build falls back to for non-x86_64). Nothing here overrides [built-in options]
# on purpose, so `readelf -h`/`-A` on the outputs always shows the distribution-default
# ISA string, matching what the test guest (stock Ubuntu riscv64) runs.

[binaries]
c = 'riscv64-linux-gnu-gcc'
cpp = 'riscv64-linux-gnu-g++'
ar = 'riscv64-linux-gnu-ar'
strip = 'riscv64-linux-gnu-strip'
# objcopy/nm are called directly by the build (vdso stripping, pal_symbols scan); the
# binutils-riscv64-linux-gnu tools are unambiguous even though the container's native
# binutils is also multi-target.
objcopy = 'riscv64-linux-gnu-objcopy'
nm = 'riscv64-linux-gnu-nm'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'riscv64'
cpu = 'riscv64'
endian = 'little'

[properties]
# Build-time target executables (the generated-offsets printers) must run under user-mode
# emulation: the container ships qemu-user-static for exactly this. Meson uses it for
# `test()` runs; `custom_target()` commands do *not* get it applied automatically, so the
# build files prepend `meson.get_external_property('exe_wrapper')` themselves (see
# libos/include/meson.build) -- verified while bringing up Phase 1 of
# dev docs: riscv/PLAN.md.
#
# `-L /usr/riscv64-linux-gnu` gives qemu the cross sysroot for the dynamic loader; the
# offsets printers are PIE binaries linked against the cross glibc, so they need it.
exe_wrapper = ['qemu-riscv64-static', '-L', '/usr/riscv64-linux-gnu']
