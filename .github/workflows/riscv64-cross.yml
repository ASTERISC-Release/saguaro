# Cross-builds the DIRECT PAL for riscv64 on an x86_64 runner. It only builds: the binaries cannot
# run on the runner, and the tests need a full-system RISC-V guest (scripts/riscv64/guest.sh;
# user-mode emulation has no seccomp, which the direct PAL depends on). See
# Documentation/devel/riscv/plan.md.
#
# Manual trigger only (Actions tab -> "RISC-V cross-build (direct PAL)" -> Run workflow).
name: RISC-V cross-build (direct PAL)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riscv64-cross-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-build:
    name: cross-build for riscv64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRAMINE_PREFIX: ${{ github.workspace }}/.install-riscv64
    steps:
      - uses: actions/checkout@v4

      # The package list of container/Containerfile.riscv64-cross, without the emulator.
      - name: Install the build dependencies and the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc make cmake patch git pkg-config gawk bison ca-certificates \
            meson ninja-build python3 python3-click python3-jinja2 python3-pyelftools \
            python3-tomli python3-tomli-w python3-voluptuous file \
            gcc-riscv64-linux-gnu g++-riscv64-linux-gnu libc6-dev-riscv64-cross \
            binutils-riscv64-linux-gnu

      - name: Cross-build and install Gramine (direct PAL, riscv64)
        run: scripts/install.sh --target riscv64 --prefix "$GRAMINE_PREFIX"

      - name: Check that the installed binaries are riscv64
        run: |
          libdir=$(dirname "$(find "$GRAMINE_PREFIX" -name libsysdb.so | head -n 1)")
          for f in "$libdir/libsysdb.so" "$libdir"/direct/loader "$libdir"/direct/libpal.so; do
            file -bL "$f" | tee /dev/stderr | grep -q "UCB RISC-V"
          done
