# Build + test matrix for the DIRECT PAL only (x86_64 and aarch64). The vm PAL (gramine-vm) is not
# covered by CI yet: it needs KVM (see test/test-vm.sh).
#
# Manual trigger only for now (Actions tab -> "Direct PAL CI (x86_64 + aarch64)" -> Run workflow). Enable automatic
# runs by adding `pull_request:` / `push:` below once the matrix has proven stable on both runners.
name: Direct PAL CI (x86_64 + aarch64)

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "test/test-direct.sh suites (default: PAL and LibOS regression only; see test/test-direct.sh --list for the application suites)"
        required: false
        default: "pal libos"
      stress:
        description: "also run scripts/stress_rewrite.sh (aarch64 only; ~10 min)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-pal:
    name: direct PAL tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      GRAMINE_PREFIX: ${{ github.workspace }}/.install
      LOGDIR: ${{ github.workspace }}/test-logs
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: scripts/dependencies.sh --build-only

      - name: Install application prerequisites
        if: ${{ inputs.suites != 'pal libos' }}
        run: INSTALL_RUSTUP=1 scripts/dependencies.sh

      - name: Build and install Gramine (direct PAL)
        run: scripts/install.sh --prefix "$GRAMINE_PREFIX"

      - name: Check built binaries for writable+executable segments
        run: |
          libdir=$(dirname "$(find "$GRAMINE_PREFIX" -name libsysdb.so | head -n 1)")
          scripts/ci/check-rwx.py "$libdir/libsysdb.so" "$libdir"/direct/loader "$libdir"/direct/libpal.so

      - name: Run the direct-PAL regression tests
        env:
          SUITES: ${{ inputs.suites }}   # via env, never interpolated into the script text
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          test/test-direct.sh $SUITES

      - name: Rewrite stress (aarch64)
        if: ${{ inputs.stress && matrix.arch == 'aarch64' }}
        run: scripts/stress_rewrite.sh -n 20

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}
          path: |
            test-logs
            /tmp/rewrite-stress-fail
          if-no-files-found: ignore
