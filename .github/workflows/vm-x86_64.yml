# VM PAL (gramine-vm) CI.
#
# gramine-vm needs hardware virtualization (/dev/kvm) on a machine of the same architecture, and
# on x86_64 also /dev/vhost-vsock. Hosted x86_64 runners provide both; the hosted aarch64 runners have
# no usable KVM, so the aarch64 vm PAL is not tested in CI (it needs a self-hosted aarch64 runner with
# /dev/kvm; see test/test-vm.sh).
#
#   x86_64-vm   builds the vm PAL on a hosted x86_64 runner and runs gramine-vm: a smoke test
#               (helloworld, a multi-threaded example) that must pass, then the LibOS regression suite
#               under the VM harness (informational at first: the skip list was measured on aarch64 and
#               x86_64 results may differ; see the job summary).
#               With the `multiprocess` input on, it then also runs the checks of the VM PAL's
#               experimental processes (sys.experimental__multiprocess = true) with assertions:
#               test/vm-multiproc/check-probes.sh, one step per check (see
#               Documentation/devel/vm-multiproc/TESTING.md, "CI").
#
# Manual trigger only (Actions tab -> "VM PAL (x86_64)" -> Run workflow).
name: VM PAL (x86_64)

on:
  workflow_dispatch:
    inputs:
      run_suite:
        description: "x86_64-vm: also run the LibOS regression suite under gramine-vm (informational)"
        type: boolean
        default: true
      ram:
        description: "x86_64-vm: guest RAM (GRAMINE_RAM_SIZE; the launcher needs >= 5G)"
        required: false
        default: "8G"
      cpus:
        description: "x86_64-vm: guest vCPUs (GRAMINE_CPU_NUM)"
        required: false
        default: "2"
      multiprocess:
        description: "x86_64-vm: also run the multi-process checks (sys.experimental__multiprocess = true)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vm-x86_64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64-vm:
    name: x86_64 vm PAL
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GRAMINE_PREFIX: ${{ github.workspace }}/.install-vm
      GRAMINE_RAM_SIZE: ${{ inputs.ram || '8G' }}
      GRAMINE_CPU_NUM: ${{ inputs.cpus || '2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM and vhost-vsock
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo modprobe vhost_vsock
          ls -l /dev/kvm /dev/vhost-vsock
          test -r /dev/kvm && test -w /dev/kvm
          test -c /dev/vhost-vsock

      - name: Install build dependencies, QEMU and virtiofsd
        run: |
          scripts/dependencies.sh --build-only
          sudo apt-get install -y -qq qemu-system-x86 virtiofsd lsof python3-psutil python3-numpy python3-scipy
          # gramine-vm starts `virtiofsd` by name; Ubuntu installs it off PATH. Symlink it instead of
          # putting /usr/libexec on PATH: that directory contains a `gcc` *directory*, which GNU make
          # picks over /usr/bin/gcc and then fails with "gcc: Permission denied" (glibc build).
          for d in /usr/libexec /usr/lib/qemu; do
            if [ -x "$d/virtiofsd" ]; then sudo ln -sf "$d/virtiofsd" /usr/local/bin/virtiofsd; break; fi
          done
          command -v virtiofsd
          qemu-system-x86_64 --version | head -1

      - name: Toolchain and header versions (for diagnosing build failures)
        run: |
          gcc --version | head -1; make --version | head -1; ld --version | head -1
          dpkg -l linux-libc-dev libc6-dev bison gawk | awk '/^ii/{print $2, $3}'
          uname -r

      - name: Build and install Gramine (direct + vm PALs, graphics disabled)
        id: build
        run: scripts/install.sh --vm --graphics disabled --prefix "$GRAMINE_PREFIX" -j "$(nproc)"

      - name: Show the glibc build log (build failed)
        if: failure()
        run: |
          # compile-no-patches.sh sends all glibc output to this file; ninja only prints its path
          log=build-vm-x86_64/subprojects/glibc-2.39-1/glibc-build.log
          if [ -f "$log" ]; then
            echo "--- first errors"; grep -n -m 10 -E "error|Error|\*\*\*" "$log" || true
            echo "--- last 80 lines"; tail -n 80 "$log"
          else
            echo "no $log"
          fi

      - name: Smoke test - helloworld under gramine-vm
        run: |
          . "$GRAMINE_PREFIX/env.sh"
          cd CI-Examples/helloworld
          make
          # virtiofsd serves / and runs with --sandbox none: run as root like the container does
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" timeout 300 gramine-vm helloworld \
            2>&1 | tee ../../vm-hello.log
          grep -q "Hello, world" ../../vm-hello.log

      - name: Smoke test - multi-threaded example under gramine-vm
        run: |
          # The example's manifests name no display; one that does (loader.env.DISPLAY = "2:N") makes
          # gramine-vm require a local X display, which a runner does not have.
          . "$GRAMINE_PREFIX/env.sh"
          cd CI-Examples/unit_tests/multi-thread
          make thread-tls thread-tls.manifest
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" timeout 300 gramine-vm thread-tls \
            2>&1 | tee ../../../vm-threads.log
          grep -q "(again)" ../../../vm-threads.log   # printed by every thread at the end of its TLS check

      - name: Smoke test - python example (hello, numpy, scipy) under gramine-vm
        run: |
          # The HTTP server/client check of the example needs TCP/IP, which the VM PAL does not have
          # yet, so only the three scripts that need no network run.
          . "$GRAMINE_PREFIX/env.sh"
          cd CI-Examples/python
          make python.manifest
          for s in helloworld test-numpy test-scipy; do
            sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" timeout 600 gramine-vm python scripts/$s.py \
              2>&1 | tee ../../vm-python-$s.log
          done
          grep -q "Hello World" ../../vm-python-helloworld.log
          grep -q "numpy.dot: " ../../vm-python-test-numpy.log
          grep -q "linalg.cholesky: " ../../vm-python-test-scipy.log

      - name: Smoke test - Redis through the VM inbound relay
        run: |
          . "$GRAMINE_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "GRAMINE_PREFIX=$GRAMINE_PREFIX" \
            timeout 600 test/test-vm-redis.sh 2>&1 | tee vm-redis.log
          grep -q "Redis PING/SET/GET and benchmark passed" vm-redis.log

      - name: LibOS regression suite under gramine-vm (informational)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_suite }}
        continue-on-error: true
        run: |
          . "$GRAMINE_PREFIX/env.sh"
          cd libos/test/regression
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" GRAMINE_VM=1 \
            gramine-test pytest -- -q -rfEsxX --tb=short -p no:cacheprovider test_libos.py \
            2>&1 | tee ../../../vm-libos.log

      # Multi-process checks (the `multiprocess` input), after the default-manifest steps so that
      # those run unchanged. Each check is its own step, runs even when an earlier one failed, and
      # reruns a failing check once (hosted guests are slow); the full guest output of each attempt
      # is in the vm-mp-logs/ of the uploaded artifact. Where the key comes from: the probe manifest
      # templates (test/vm-multiproc/*.manifest.template), GRAMINE_VM_MULTIPROCESS=1 for the LibOS
      # regression manifests, and an edit of the examples' generated manifests (restored after).
      - name: Multi-process - spawn (sh pipeline and command substitution, system(), posix_spawn)
        if: ${{ !cancelled() && inputs.multiprocess && steps.build.outcome == 'success' }}
        run: |
          . "$GRAMINE_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "GRAMINE_PREFIX=$GRAMINE_PREFIX" \
            "GRAMINE_CPU_NUM=$GRAMINE_CPU_NUM" "LOGDIR=$GITHUB_WORKSPACE/vm-mp-logs" TIMEOUT_SCALE=2 \
            test/vm-multiproc/check-probes.sh spawn 2>&1 | tee vm-mp-spawn.log
          exit "${PIPESTATUS[0]}"

      - name: Multi-process - signals between processes (bash, sig.sh)
        if: ${{ !cancelled() && inputs.multiprocess && steps.build.outcome == 'success' }}
        run: |
          . "$GRAMINE_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "GRAMINE_PREFIX=$GRAMINE_PREFIX" \
            "GRAMINE_CPU_NUM=$GRAMINE_CPU_NUM" "LOGDIR=$GITHUB_WORKSPACE/vm-mp-logs" TIMEOUT_SCALE=2 \
            test/vm-multiproc/check-probes.sh signals 2>&1 | tee vm-mp-signals.log
          exit "${PIPESTATUS[0]}"

      - name: Multi-process - fork stress (1000 sequential, 64 in batches of 8)
        if: ${{ !cancelled() && inputs.multiprocess && steps.build.outcome == 'success' }}
        run: |
          . "$GRAMINE_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "GRAMINE_PREFIX=$GRAMINE_PREFIX" \
            "GRAMINE_CPU_NUM=$GRAMINE_CPU_NUM" "LOGDIR=$GITHUB_WORKSPACE/vm-mp-logs" TIMEOUT_SCALE=2 \
            test/vm-multiproc/check-probes.sh forks 2>&1 | tee vm-mp-forks.log
          exit "${PIPESTATUS[0]}"

      - name: Multi-process - forked child (SysV IPC, memfd, file calls, timers, inotify)
        if: ${{ !cancelled() && inputs.multiprocess && steps.build.outcome == 'success' }}
        run: |
          . "$GRAMINE_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "GRAMINE_PREFIX=$GRAMINE_PREFIX" \
            "GRAMINE_CPU_NUM=$GRAMINE_CPU_NUM" "LOGDIR=$GITHUB_WORKSPACE/vm-mp-logs" TIMEOUT_SCALE=2 \
            test/vm-multiproc/check-probes.sh misc 2>&1 | tee vm-mp-misc.log
          exit "${PIPESTATUS[0]}"

      - name: Multi-process - LibOS regressions fork_and_exec and vfork_and_exec
        if: ${{ !cancelled() && inputs.multiprocess && steps.build.outcome == 'success' }}
        run: |
          . "$GRAMINE_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "GRAMINE_PREFIX=$GRAMINE_PREFIX" \
            "GRAMINE_CPU_NUM=$GRAMINE_CPU_NUM" "LOGDIR=$GITHUB_WORKSPACE/vm-mp-logs" TIMEOUT_SCALE=2 \
            test/vm-multiproc/check-probes.sh libos 2>&1 | tee vm-mp-libos.log
          exit "${PIPESTATUS[0]}"

      - name: Multi-process - examples (helloworld, thread-tls, python, bash 7 checks)
        if: ${{ !cancelled() && inputs.multiprocess && steps.build.outcome == 'success' }}
        run: |
          . "$GRAMINE_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "GRAMINE_PREFIX=$GRAMINE_PREFIX" \
            "GRAMINE_CPU_NUM=$GRAMINE_CPU_NUM" "LOGDIR=$GITHUB_WORKSPACE/vm-mp-logs" TIMEOUT_SCALE=2 \
            test/vm-multiproc/check-probes.sh examples 2>&1 | tee vm-mp-examples.log
          exit "${PIPESTATUS[0]}"

      - name: Multi-process - redis BGSAVE (forked child writes the dump)
        if: ${{ !cancelled() && inputs.multiprocess && steps.build.outcome == 'success' }}
        run: |
          . "$GRAMINE_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "GRAMINE_PREFIX=$GRAMINE_PREFIX" \
            "GRAMINE_CPU_NUM=$GRAMINE_CPU_NUM" "LOGDIR=$GITHUB_WORKSPACE/vm-mp-logs" TIMEOUT_SCALE=2 \
            test/vm-multiproc/check-probes.sh redis 2>&1 | tee vm-mp-redis.log
          exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### x86_64 vm PAL"
            echo '```'
            tail -n 3 vm-hello.log 2>/dev/null || echo "(no helloworld log)"
            echo '--- python example'
            tail -n 1 vm-python-test-scipy.log 2>/dev/null || echo "(python example not run)"
            echo '--- Redis inbound relay'
            tail -n 1 vm-redis.log 2>/dev/null || echo "(Redis relay test not run)"
            echo '--- libos suite'
            tail -n 1 vm-libos.log 2>/dev/null || echo "(suite not run)"
            if [ "${{ inputs.multiprocess }}" = true ]; then
              echo '--- multi-process checks (sys.experimental__multiprocess = true)'
              for c in spawn signals forks misc libos examples redis; do
                grep -E "^(PASS|FAIL) $c" "vm-mp-$c.log" 2>/dev/null || echo "(not run) $c"
              done
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-vm-x86_64
          if-no-files-found: ignore
          path: |
            vm-*.log
            vm-mp-logs/
            build-vm-x86_64/subprojects/glibc-2.39-1/glibc-build.log
