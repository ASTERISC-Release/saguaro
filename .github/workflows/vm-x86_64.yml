# VM PAL (saguaro-vm) CI.
#
# saguaro-vm needs hardware virtualization (/dev/kvm) on a machine of the same architecture, and
# on x86_64 also /dev/vhost-vsock. Hosted x86_64 runners provide both; the hosted aarch64 runners have
# no usable KVM, so the aarch64 vm PAL is tested under software emulation instead (vm-aarch64-tcg.yml);
# on a machine with /dev/kvm use test/quick.sh vm.
#
#   x86_64-vm   builds the vm PAL on a hosted x86_64 runner, checks the inbound relay with Redis, and runs
#               test/quick.sh vm: the regression tier by default (smoke tests, the LibOS core list under the
#               VM harness, nine examples, the VM network suites and the multi-process probes, at 2 vCPUs;
#               test/README.md). The tier input selects smoke or extended (the full suite, the vCPU sweep,
#               loops and the stress tests of test/vm/stress).
#
# Manual trigger only (Actions tab -> "VM PAL (x86_64)" -> Run workflow).
name: VM PAL (x86_64)

on:
  schedule:
    - cron: '47 9 * * *'   # nightly, UTC
  workflow_dispatch:
    inputs:
      tier:
        description: "test/quick.sh tier: smoke, regression or extended"
        type: choice
        options:
          - smoke
          - regression
          - extended
        default: regression
      ram:
        description: "x86_64-vm: guest RAM (SAGUARO_RAM_SIZE; the launcher needs >= 5G)"
        required: false
        default: "8G"
      cpus:
        description: "x86_64-vm: guest vCPUs (SAGUARO_CPU_NUM; the regression tier is defined at 2)"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: vm-x86_64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64-vm:
    name: x86_64 vm PAL
    runs-on: ubuntu-24.04
    timeout-minutes: 360                      # the regression tier takes minutes; the extended tier hours
    env:
      SAGUARO_PREFIX: ${{ github.workspace }}/.install-vm
      SAGUARO_RAM_SIZE: ${{ inputs.ram || '8G' }}
      SAGUARO_CPU_NUM: ${{ inputs.cpus || '2' }}
      TIMEOUT_SCALE: "2"                       # the multi-process probes: hosted guests are slow
      LOGDIR: ${{ github.workspace }}/vm-mp-logs
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM and vhost-vsock
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo modprobe vhost_vsock
          ls -l /dev/kvm /dev/vhost-vsock
          test -r /dev/kvm && test -w /dev/kvm
          test -c /dev/vhost-vsock

      - name: Install build dependencies, QEMU and virtiofsd
        run: |
          scripts/dependencies.sh --build-only
          sudo apt-get install -y -qq qemu-system-x86 virtiofsd lsof python3-psutil python3-numpy python3-scipy
          # saguaro-vm starts `virtiofsd` by name; Ubuntu installs it off PATH. Symlink it instead of
          # putting /usr/libexec on PATH: that directory contains a `gcc` *directory*, which GNU make
          # picks over /usr/bin/gcc and then fails with "gcc: Permission denied" (glibc build).
          for d in /usr/libexec /usr/lib/qemu; do
            if [ -x "$d/virtiofsd" ]; then sudo ln -sf "$d/virtiofsd" /usr/local/bin/virtiofsd; break; fi
          done
          command -v virtiofsd
          qemu-system-x86_64 --version | head -1

      - name: Toolchain and header versions (for diagnosing build failures)
        run: |
          gcc --version | head -1; make --version | head -1; ld --version | head -1
          dpkg -l linux-libc-dev libc6-dev bison gawk | awk '/^ii/{print $2, $3}'
          uname -r

      - name: Build and install Saguaro (direct + vm PALs, graphics disabled)
        id: build
        run: scripts/install.sh --vm --graphics disabled --prefix "$SAGUARO_PREFIX" -j "$(nproc)"

      - name: Show the glibc build log (build failed)
        if: failure()
        run: |
          # compile-no-patches.sh sends all glibc output to this file; ninja only prints its path
          log=build-vm-x86_64/subprojects/glibc-2.39-1/glibc-build.log
          if [ -f "$log" ]; then
            echo "--- first errors"; grep -n -m 10 -E "error|Error|\*\*\*" "$log" || true
            echo "--- last 80 lines"; tail -n 80 "$log"
          else
            echo "no $log"
          fi

      - name: Smoke test - Redis through the VM inbound relay
        run: |
          . "$SAGUARO_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "SAGUARO_PREFIX=$SAGUARO_PREFIX" \
            timeout 600 test/vm/network/test-vm-redis.sh 2>&1 | tee vm-redis.log
          grep -q "Redis PING/SET/GET and benchmark passed" vm-redis.log

      - name: Install the prerequisites of the examples
        env:
          TIER: ${{ inputs.tier || 'regression' }}   # via env, never interpolated into the script text
        run: |
          # the rust example needs rustup
          INSTALL_RUSTUP=1 scripts/dependencies.sh

      - name: Regression tests (test/quick.sh vm)
        env:
          TIER: ${{ inputs.tier || 'regression' }}   # via env, never interpolated into the script text
        run: |
          # saguaro-vm's virtiofsd serves / and needs root, as in the Redis step
          . "$SAGUARO_PREFIX/env.sh"
          export PATH="$HOME/.cargo/bin:$PATH"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "SAGUARO_PREFIX=$SAGUARO_PREFIX" \
            "SAGUARO_VM_PREFIX=$SAGUARO_PREFIX" "EXEC_LOG_DIR=$GITHUB_WORKSPACE/quick-out/exec-logs" \
            test/quick.sh vm --tier "$TIER" --vcpus "$SAGUARO_CPU_NUM" --out "$GITHUB_WORKSPACE/quick-out" \
            2>&1 | tee quick.log
          exit "${PIPESTATUS[0]}"

      - name: Give the workspace back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### x86_64 vm PAL"
            echo '```'
            echo '--- Redis inbound relay'
            tail -n 1 vm-redis.log 2>/dev/null || echo "(Redis relay test not run)"
            echo '--- test/quick.sh vm'
            cat quick-out/summary.txt 2>/dev/null || echo "(no summary: the run did not finish)"
            grep -E ',(fail|known-fail)(,|$)' quick-out/results.csv 2>/dev/null | cut -d, -f5-7 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-vm-x86_64
          if-no-files-found: ignore
          path: |
            vm-*.log
            quick.log
            quick-out
            vm-mp-logs/
            build-vm-x86_64/subprojects/glibc-2.39-1/glibc-build.log
