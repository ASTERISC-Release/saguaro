# Checks that the development documents name only files that exist and that README.md and INSTALL.md
# parse (scripts/check-docs.py). It needs no build and runs in seconds.
#
# Manual trigger only (Actions tab -> "Documentation check" -> Run workflow), like the other workflows.
name: Documentation check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: documents name existing files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the documents
        run: scripts/check-docs.py
