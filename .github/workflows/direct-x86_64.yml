# Builds the DIRECT PAL natively on a hosted x86_64 runner and runs test/quick.sh direct (the regression tier
# by default; test/README.md). The other
# platforms have workflows of their own: direct-aarch64.yml, direct-riscv64-emulated.yml (cross-built,
# tested in an emulated guest) and vm-x86_64.yml (the vm PAL).
#
# Manual trigger only (Actions tab -> "Direct PAL (x86_64)" -> Run workflow).
name: Direct PAL (x86_64)

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "test/quick.sh tier: smoke, regression (the PAL suite, the LibOS core list, nine examples, test/unit) or extended (the long suites, all examples)"
        type: choice
        options:
          - smoke
          - regression
          - extended
        default: regression
      tdx_build:
        description: "Also compile the TDX PAL (build only: it cannot run without TDX hardware, and the td-shim link step of the install is skipped)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: direct-x86_64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-pal:
    name: direct PAL tests (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SAGUARO_PREFIX: ${{ github.workspace }}/.install
      EXEC_LOG_DIR: ${{ github.workspace }}/quick-out/exec-logs
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: scripts/dependencies.sh --build-only

      - name: Install the prerequisites of the examples
        env:
          TIER: ${{ inputs.tier || 'regression' }}   # via env, never interpolated into the script text
        run: |
          # the rust example needs rustup
          INSTALL_RUSTUP=1 scripts/dependencies.sh

      - name: Build and install Saguaro (direct PAL)
        run: scripts/install.sh --prefix "$SAGUARO_PREFIX"

      - name: Check built binaries for writable+executable segments
        run: |
          libdir=$(dirname "$(find "$SAGUARO_PREFIX" -name libsysdb.so | head -n 1)")
          scripts/ci/check-rwx.py "$libdir/libsysdb.so" "$libdir"/direct/loader "$libdir"/direct/libpal.so

      - name: Regression tests (test/quick.sh direct)
        env:
          TIER: ${{ inputs.tier || 'regression' }}   # via env, never interpolated into the script text
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          test/quick.sh direct --tier "$TIER" --out "$GITHUB_WORKSPACE/quick-out" | tee quick.log
          exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Direct PAL (x86_64)"
            echo '```'
            cat quick-out/summary.txt 2>/dev/null || echo "(no summary: the run did not finish)"
            grep -E ',(fail|known-fail)(,|$)' quick-out/results.csv 2>/dev/null | cut -d, -f5-7 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-direct-x86_64
          path: |
            quick-out
            quick.log
            /tmp/rewrite-stress-fail
          if-no-files-found: ignore

  tdx-build:
    # The TDX PAL shares vm-common with the vm PAL, so a vm-only change can break it without any
    # test noticing; this job only compiles it (meson + ninja, no install: the install links the
    # PAL with td-shim, which is not on the runner).
    name: TDX PAL build (x86_64, build only)
    if: ${{ inputs.tdx_build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: scripts/dependencies.sh --build-only

      - name: Build the TDX PAL
        run: |
          # graphics off: with a VM-type PAL it would build libgraphics.so, which needs EGL headers
          meson setup build-tdx -Dtdx=enabled -Ddirect=enabled -Dsgx=disabled -Dvm=disabled \
              -Dgraphics=disabled -Dlibc=none -Dtests=disabled -Dbuildtype=release
          ninja -C build-tdx
          test -x build-tdx/pal/src/host/tdx/pal
