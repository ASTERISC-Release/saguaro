# Multi-architecture build + test matrix for the direct PAL (x86_64 and aarch64).
#
# Manual trigger only for now (Actions tab -> "Multi-arch CI" -> Run workflow). Enable automatic
# runs by adding `pull_request:` / `push:` below once the matrix has proven stable on both runners.
name: Multi-arch CI

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "scripts/test.sh suites (empty = all)"
        required: false
        default: ""
      stress:
        description: "also run scripts/stress_rewrite.sh (aarch64 only; ~10 min)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: multiarch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-pal:
    name: direct PAL (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      GRAMINE_PREFIX: ${{ github.workspace }}/.install
      LOGDIR: ${{ github.workspace }}/test-logs
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test prerequisites
        run: INSTALL_RUSTUP=1 scripts/dependencies.sh

      - name: Build and install Gramine (direct PAL)
        run: scripts/install.sh --prefix "$GRAMINE_PREFIX"

      - name: Check built binaries for writable+executable segments
        run: |
          libdir=$(dirname "$(find "$GRAMINE_PREFIX" -name libsysdb.so | head -n 1)")
          scripts/ci/check-rwx.py "$libdir/libsysdb.so" "$libdir"/direct/loader "$libdir"/direct/libpal.so

      - name: Run the test battery
        env:
          SUITES: ${{ inputs.suites }}   # via env, never interpolated into the script text
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/test.sh $SUITES

      - name: Rewrite stress (aarch64)
        if: ${{ inputs.stress && matrix.arch == 'aarch64' }}
        run: scripts/stress_rewrite.sh -n 20

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}
          path: |
            test-logs
            /tmp/rewrite-stress-fail
          if-no-files-found: ignore
