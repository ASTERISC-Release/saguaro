# Builds the DIRECT PAL natively on a hosted aarch64 runner and runs test/quick.sh direct (the regression tier
# by default; test/README.md). The other
# platforms have workflows of their own: direct-x86_64.yml, direct-riscv64-emulated.yml (cross-built,
# tested in an emulated guest) and vm-x86_64.yml (the vm PAL).
#
# With the `vm_build` input on (the default), a second job builds and installs the aarch64 VM PAL
# (saguaro-vm) and renders and checks the helloworld manifest with it. Build only: the hosted aarch64
# runners have no usable KVM (run it on an aarch64 machine with /dev/kvm: test/vm/test-vm.sh). It exists
# because main once stopped building the aarch64 VM PAL unnoticed (the x86_64-only multiprocess work,
# dev docs: syscall-compat/TODO.md).
#
# Manual trigger only (Actions tab -> "Direct PAL (aarch64)" -> Run workflow).
name: Direct PAL (aarch64)

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "test/quick.sh tier: smoke, regression (the PAL suite, the LibOS core list, nine examples, test/unit) or extended (the long suites, all examples, the rewrite stress)"
        type: choice
        options:
          - smoke
          - regression
          - extended
        default: regression
      stress:
        description: "also run scripts/stress_rewrite.sh (~10 min; the extended tier runs it anyway)"
        type: boolean
        default: false
      libc:
        description: "libc built into the runtime directory: none (the default: no libc is built, applications run on the runner's glibc) or glibc (bundled)"
        type: choice
        options:
          - none
          - glibc
        default: none
      vm_build:
        description: "also build and install the aarch64 vm PAL (build only, no KVM on the runner)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: direct-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-pal:
    name: direct PAL tests (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      SAGUARO_PREFIX: ${{ github.workspace }}/.install
      EXEC_LOG_DIR: ${{ github.workspace }}/quick-out/exec-logs
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: scripts/dependencies.sh --build-only

      - name: Install the prerequisites of the examples
        env:
          TIER: ${{ inputs.tier || 'regression' }}   # via env, never interpolated into the script text
        run: |
          # the rust example needs rustup
          INSTALL_RUSTUP=1 scripts/dependencies.sh

      - name: Build and install Saguaro (direct PAL)
        env:
          LIBC: ${{ inputs.libc || 'none' }}   # via env, never interpolated into the script text
        run: scripts/install.sh --prefix "$SAGUARO_PREFIX" --libc "$LIBC"

      - name: Check built binaries for writable+executable segments
        run: |
          libdir=$(dirname "$(find "$SAGUARO_PREFIX" -name libsysdb.so | head -n 1)")
          scripts/ci/check-rwx.py "$libdir/libsysdb.so" "$libdir"/direct/loader "$libdir"/direct/libpal.so

      - name: Regression tests (test/quick.sh direct)
        env:
          TIER: ${{ inputs.tier || 'regression' }}   # via env, never interpolated into the script text
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          test/quick.sh direct --tier "$TIER" --out "$GITHUB_WORKSPACE/quick-out" | tee quick.log
          exit "${PIPESTATUS[0]}"

      - name: Rewrite stress (aarch64)
        if: ${{ inputs.stress && inputs.tier != 'extended' }}
        run: scripts/stress_rewrite.sh -n 20

      - name: Summary
        if: always()
        run: |
          {
            echo "### Direct PAL (aarch64)"
            echo '```'
            cat quick-out/summary.txt 2>/dev/null || echo "(no summary: the run did not finish)"
            grep -E ',(fail|known-fail)(,|$)' quick-out/results.csv 2>/dev/null | cut -d, -f5-7 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-direct-aarch64
          path: |
            quick-out
            quick.log
            /tmp/rewrite-stress-fail
          if-no-files-found: ignore

  vm-build:
    name: vm PAL build (aarch64, no KVM)
    if: ${{ inputs.vm_build }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      SAGUARO_PREFIX: ${{ github.workspace }}/.install-vm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: scripts/dependencies.sh --build-only

      - name: Build and install Saguaro (vm PAL, graphics disabled)
        run: scripts/install.sh --vm --graphics disabled --prefix "$SAGUARO_PREFIX" -j "$(nproc)"

      - name: Check the installed vm PAL
        run: |
          . "$SAGUARO_PREFIX/env.sh"
          command -v saguaro-vm
          pal=$(find "$SAGUARO_PREFIX" -path '*/saguaro/vm/pal' -type f | head -n 1)
          test -n "$pal"
          file "$pal"

      - name: Render and check a VM manifest (helloworld)
        run: |
          . "$SAGUARO_PREFIX/env.sh"
          make -C CI-Examples/helloworld helloworld helloworld.manifest   # also runs saguaro-manifest-check
