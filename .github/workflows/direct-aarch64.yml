# Builds the DIRECT PAL natively on a hosted aarch64 runner and runs test/test-direct.sh. The other
# platforms have workflows of their own: direct-x86_64.yml, direct-riscv64-emulated.yml (cross-built,
# tested in an emulated guest) and vm-x86_64.yml (the vm PAL).
#
# Manual trigger only (Actions tab -> "Direct PAL (aarch64)" -> Run workflow).
name: Direct PAL (aarch64)

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "test/test-direct.sh suites (default: PAL and LibOS regression and the python example; see test/test-direct.sh --list for the other application suites)"
        required: false
        default: "pal libos python"
      stress:
        description: "also run scripts/stress_rewrite.sh (~10 min)"
        type: boolean
        default: false
      libc:
        description: "libc built into the runtime directory: none (the default: no libc is built, applications run on the runner's glibc) or glibc (bundled)"
        type: choice
        options:
          - none
          - glibc
        default: none

permissions:
  contents: read

concurrency:
  group: direct-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-pal:
    name: direct PAL tests (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      GRAMINE_PREFIX: ${{ github.workspace }}/.install
      LOGDIR: ${{ github.workspace }}/test-logs
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: scripts/dependencies.sh --build-only

      - name: Install application prerequisites
        if: ${{ inputs.suites != '' && inputs.suites != 'pal libos' }}
        run: INSTALL_RUSTUP=1 scripts/dependencies.sh

      - name: Build and install Gramine (direct PAL)
        env:
          LIBC: ${{ inputs.libc || 'none' }}   # via env, never interpolated into the script text
        run: scripts/install.sh --prefix "$GRAMINE_PREFIX" --libc "$LIBC"

      - name: Check built binaries for writable+executable segments
        run: |
          libdir=$(dirname "$(find "$GRAMINE_PREFIX" -name libsysdb.so | head -n 1)")
          scripts/ci/check-rwx.py "$libdir/libsysdb.so" "$libdir"/direct/loader "$libdir"/direct/libpal.so

      - name: Run the direct-PAL regression tests
        env:
          SUITES: ${{ inputs.suites || 'pal libos python' }}   # via env, never interpolated into the script text
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          test/test-direct.sh $SUITES

      - name: Rewrite stress (aarch64)
        if: ${{ inputs.stress }}
        run: scripts/stress_rewrite.sh -n 20

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-direct-aarch64
          path: |
            test-logs
            /tmp/rewrite-stress-fail
          if-no-files-found: ignore
