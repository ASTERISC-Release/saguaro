# The aarch64 VM PAL (saguaro-vm) under QEMU software emulation (TCG).
#
# Hosted aarch64 runners have no usable KVM, so the launcher (tools/saguaro-vm-aarch64.in) falls back to
# `-accel tcg,thread=multi -cpu max` by itself. The aarch64 VM PAL is built natively with
# scripts/install.sh --vm (no cross toolchain exists in the repository), hence the arm64 runner.
#
# Manual trigger only (Actions tab -> "VM PAL (aarch64, TCG)" -> Run workflow).
name: VM PAL (aarch64, TCG)

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "test/quick.sh tier: smoke, regression or extended"
        type: choice
        options:
          - smoke
          - regression
          - extended
        default: regression
      cpus:
        description: "guest vCPUs (SAGUARO_CPU_NUM; the regression tier is defined at 2)"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: vm-aarch64-tcg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aarch64-vm-tcg:
    name: aarch64 vm PAL (TCG)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      SAGUARO_PREFIX: ${{ github.workspace }}/.install-vm
      SAGUARO_CPU_NUM: ${{ inputs.cpus || '2' }}
      SAGUARO_TEST_TIMEOUT: "300"          # seconds per test; software emulation needs more than the 40 to 120 s defaults
      EXEC_TIMEOUT: "900"                  # seconds per example (exec.sh): software emulation
      QUICK_TIMEOUT_SCALE: "2"             # test/quick.sh step timeouts
      TIMEOUT_SCALE: "2"                   # the multi-process probes of the extended tier
      # test_604_sigreturn_regs hangs on the hosted runner under TCG (it passes under TCG on a local aarch64
      # machine; Documentation/TODO.md). It is not in the core list; the extended tier leaves it out here.
      QUICK_PYTEST_K: test_604_sigreturn_regs
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies, QEMU and virtiofsd
        run: |
          scripts/dependencies.sh --build-only
          # qemu-system-arm provides qemu-system-aarch64 (8.2.2 on noble, the version measured)
          sudo apt-get install -y -qq qemu-system-arm virtiofsd device-tree-compiler \
            procps file iproute2 lsof
          # saguaro-vm starts `virtiofsd` by name (as in vm-x86_64.yml)
          for d in /usr/libexec /usr/lib/qemu; do
            if [ -x "$d/virtiofsd" ]; then sudo ln -sf "$d/virtiofsd" /usr/local/bin/virtiofsd; break; fi
          done
          command -v virtiofsd dtc
          qemu-system-aarch64 --version | head -1

      - name: vhost-vsock (the guest's TCP/UDP sockets and the relay need it; no /dev/kvm needed)
        run: |
          sudo modprobe vhost_vsock || echo "::warning::vhost_vsock is not available on this kernel"
          sudo chmod 0666 /dev/vhost-vsock || true
          ls -l /dev/vhost-vsock || echo "no /dev/vhost-vsock: socket tests will fail (SAGUARO_VSOCK=0 fallback)"
          ls -l /dev/kvm || echo "no /dev/kvm (expected): QEMU runs with TCG"
          uname -r

      - name: Build and install Saguaro (aarch64 vm PAL)
        run: scripts/install.sh --vm --prefix "$SAGUARO_PREFIX" -j "$(nproc)"

      - name: Install the prerequisites of the examples
        env:
          TIER: ${{ inputs.tier || 'regression' }}   # via env, never interpolated into the script text
        run: |
          # the rust example needs rustup
          INSTALL_RUSTUP=1 scripts/dependencies.sh

      - name: Regression tests (test/quick.sh vm)
        env:
          TIER: ${{ inputs.tier || 'regression' }}   # via env, never interpolated into the script text
        run: |
          # saguaro-vm's virtiofsd serves / with --sandbox none: run as root, like the container does
          . "$SAGUARO_PREFIX/env.sh"
          export PATH="$HOME/.cargo/bin:$PATH"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "SAGUARO_PREFIX=$SAGUARO_PREFIX" \
            "SAGUARO_VM_PREFIX=$SAGUARO_PREFIX" "EXEC_LOG_DIR=$GITHUB_WORKSPACE/quick-out/exec-logs" \
            test/quick.sh vm --tier "$TIER" --vcpus "$SAGUARO_CPU_NUM" --out "$GITHUB_WORKSPACE/quick-out" \
            2>&1 | tee quick.log
          exit "${PIPESTATUS[0]}"

      - name: Give the workspace back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### aarch64 vm PAL (TCG)"
            echo '```'
            cat quick-out/summary.txt 2>/dev/null || echo "(no summary: the run did not finish)"
            grep -E ',(fail|known-fail)(,|$)' quick-out/results.csv 2>/dev/null | cut -d, -f5-7 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vm-aarch64-tcg-logs
          path: |
            quick.log
            quick-out
