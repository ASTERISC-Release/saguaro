# The aarch64 VM PAL (saguaro-vm) under QEMU software emulation (TCG).
#
# Hosted aarch64 runners have no usable KVM, so the launcher (tools/saguaro-vm-aarch64.in) falls back to
# `-accel tcg,thread=multi -cpu max` by itself. The aarch64 VM PAL is built natively with
# scripts/install.sh --vm (no cross toolchain exists in the repository), hence the arm64 runner.
#
# Manual trigger only (Actions tab -> "VM PAL (aarch64, TCG)" -> Run workflow).
name: VM PAL (aarch64, TCG)

on:
  workflow_dispatch:
    inputs:
      run_suite:
        description: "also run the LibOS regression suite under saguaro-vm"
        type: boolean
        default: true
      cpus:
        description: "guest vCPUs (SAGUARO_CPU_NUM)"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: vm-aarch64-tcg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aarch64-vm-tcg:
    name: aarch64 vm PAL (TCG)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      SAGUARO_PREFIX: ${{ github.workspace }}/.install-vm
      SAGUARO_CPU_NUM: ${{ inputs.cpus || '2' }}
      SAGUARO_TEST_TIMEOUT: "300"          # seconds per test; software emulation needs more than the 40 to 120 s defaults
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies, QEMU and virtiofsd
        run: |
          scripts/dependencies.sh --build-only
          # qemu-system-arm provides qemu-system-aarch64 (8.2.2 on noble, the version measured)
          sudo apt-get install -y -qq qemu-system-arm virtiofsd device-tree-compiler \
            procps file iproute2 lsof
          # saguaro-vm starts `virtiofsd` by name (as in vm-x86_64.yml)
          for d in /usr/libexec /usr/lib/qemu; do
            if [ -x "$d/virtiofsd" ]; then sudo ln -sf "$d/virtiofsd" /usr/local/bin/virtiofsd; break; fi
          done
          command -v virtiofsd dtc
          qemu-system-aarch64 --version | head -1

      - name: vhost-vsock (the guest's TCP/UDP sockets and the relay need it; no /dev/kvm needed)
        run: |
          sudo modprobe vhost_vsock || echo "::warning::vhost_vsock is not available on this kernel"
          sudo chmod 0666 /dev/vhost-vsock || true
          ls -l /dev/vhost-vsock || echo "no /dev/vhost-vsock: socket tests will fail (SAGUARO_VSOCK=0 fallback)"
          ls -l /dev/kvm || echo "no /dev/kvm (expected): QEMU runs with TCG"
          uname -r

      - name: Build and install Gramine (aarch64 vm PAL)
        run: scripts/install.sh --vm --prefix "$SAGUARO_PREFIX" -j "$(nproc)"

      - name: Smoke test - helloworld under saguaro-vm (TCG)
        run: |
          . "$SAGUARO_PREFIX/env.sh"
          cd CI-Examples/helloworld
          make
          # virtiofsd serves / with --sandbox none: run as root, like the container does
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" timeout 300 saguaro-vm helloworld \
            2>&1 | tee ../../vm-hello.log
          grep -q "Hello, world" ../../vm-hello.log

      - name: CI-Examples under saguaro-vm (helloworld, mremap, threads, bash, busybox, sqlite)
        run: |
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" RUN_TIMEOUT=600 VM_PREFIX="$SAGUARO_PREFIX" \
            OUT="$GITHUB_WORKSPACE/vm-examples" tools/run-vm-aarch64-examples.sh 2>&1 | tee vm-examples.log
          grep -q "fail=0" vm-examples.log

      - name: VM network suites (vsock relay)
        run: |
          . "$SAGUARO_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" SAGUARO_PREFIX="$SAGUARO_PREFIX" \
            test/vm/test-vm.sh --prefix "$SAGUARO_PREFIX" loopback epoll outbound udp guest-loopback \
            2>&1 | tee vm-net.log

      - name: Install the prerequisites of the memcached and nginx examples
        run: scripts/dependencies.sh

      - name: memcached example (./exec.sh --vm)
        run: |
          export SAGUARO_VM_PREFIX="$SAGUARO_PREFIX"
          cd CI-Examples/memcached
          # saguaro-vm's virtiofsd serves / and needs root, as in the other steps
          sudo -E env "PATH=$PATH" "PYTHONPATH=${PYTHONPATH:-}" ./exec.sh --vm

      - name: nginx example (./exec.sh --vm)
        run: |
          export SAGUARO_VM_PREFIX="$SAGUARO_PREFIX"
          cd CI-Examples/nginx
          sudo -E env "PATH=$PATH" "PYTHONPATH=${PYTHONPATH:-}" ./exec.sh --vm

      - name: Give the workspace back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: LibOS regression suite under saguaro-vm
        env:
          # test_604_sigreturn_regs hangs on the hosted runner under TCG (it passes under TCG on a local
          # aarch64 machine); see Documentation/TODO.md. Everything else must pass.
          PYTEST_K: not test_604_sigreturn_regs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_suite }}
        run: |
          . "$SAGUARO_PREFIX/env.sh"
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "PYTEST_K=$PYTEST_K" \
            test/vm/test-vm.sh --prefix "$SAGUARO_PREFIX" libos 2>&1 | tee vm-libos.log
          exit "${PIPESTATUS[0]}"

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vm-aarch64-tcg-logs
          path: |
            vm-*.log
            vm-examples/
            /tmp/saguaro-exec/
