# Copyright (C) 2026 The ASTERISC Research Lab
# Cross-builds the DIRECT PAL for riscv64 on a hosted x86_64 runner and tests it in a RISC-V Linux
# guest under qemu-system-riscv64 (full-system emulation, no KVM). User-mode emulation cannot be
# used: it has no seccomp, which the direct PAL depends on. Everything runs in the cross container
# (container/run.sh --target riscv64), exactly as on a development machine; see
# dev docs: riscv/PLAN.md.
#
# The guest is emulated, so this is slow (the first boot installs packages) and timing-sensitive
# tests have less headroom than on real hardware. The tests run through test/quick.sh direct --target riscv64
# (the tiers are described in test/README.md); the guest boot is a step of its own and is not part of the budget.
#
# Manual trigger only (Actions tab -> "Direct PAL (riscv64, emulated)" -> Run workflow).
name: Direct PAL (riscv64, emulated)

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "test/quick.sh tier: smoke, regression (the PAL suite, the LibOS core list, the examples below) or extended (the full LibOS suite); \"none\": cross-build only"
        required: false
        default: "regression"
      examples:
        description: "examples of the regression tier, built in the guest (slow: the default is python only; the full set is: bash sqlite python busybox memcached redis lighttpd rust nginx)"
        required: false
        default: "python"

permissions:
  contents: read

concurrency:
  group: direct-riscv64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-pal:
    name: direct PAL tests (riscv64, emulated)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TIER: ${{ inputs.tier || 'regression' }}          # via env, never interpolated into the script text
      EXAMPLES: ${{ inputs.examples || 'python' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the cross container
        run: |
          podman --version
          container/run.sh --target riscv64 'riscv64-linux-gnu-gcc --version | head -1; qemu-system-riscv64 --version | head -1'

      - name: Cross-build and install Saguaro (direct PAL, riscv64)
        run: |
          container/run.sh --target riscv64 \
            'scripts/install.sh --target riscv64 --prefix "$PWD/build-riscv64/prefix" -j "$(nproc)"'

      - name: Check that the installed binaries are riscv64
        run: |
          libdir=$(dirname "$(find build-riscv64/prefix -name libsysdb.so | head -n 1)")
          for f in "$libdir/libsysdb.so" "$libdir"/direct/loader "$libdir"/direct/libpal.so; do
            file -bL "$f" | tee /dev/stderr | grep -q "UCB RISC-V"
          done

      - name: Boot the RISC-V guest
        if: ${{ inputs.tier != 'none' }}
        run: |
          container/run.sh --target riscv64 'RISCV_GUEST_BOOT_TIMEOUT=3600 scripts/riscv64/guest.sh start && scripts/riscv64/guest.sh ssh "uname -a; nproc; free -m"'

      - name: Install the build prerequisites of the examples in the guest
        if: ${{ inputs.tier != 'none' }}
        run: |
          container/run.sh --target riscv64 \
            'scripts/riscv64/guest.sh ssh "DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential cmake pkg-config curl wget sqlite3 libevent-dev libssl-dev libpcre2-dev python3-numpy python3-scipy autoconf automake libtool >/dev/null"'

      - name: Regression tests in the guest (test/quick.sh direct --target riscv64)
        if: ${{ inputs.tier != 'none' }}
        run: |
          # Emulation on a hosted runner is several times slower than on a workstation: each test gets
          # more time (SAGUARO_TEST_TIMEOUT). The core list has neither test_103_gettimeofday, whose own
          # 20 s limit for 4 million calls cannot be met here (every call is a seccomp trap; see the port's
          # plan), nor test_603_rewrite_stress, whose `threads` scenario ran into its own 240 s alarm on both
          # hosted runs (cause not established, probably the runner: Documentation/TODO.md); the extended
          # tier leaves them out through QUICK_PYTEST_K.
          set -o pipefail
          container/run.sh --target riscv64 \
            "SAGUARO_TEST_TIMEOUT=600 QUICK_PYTEST_K='test_103_gettimeofday or test_603_rewrite_stress' QUICK_RISCV64_EXAMPLES=$(printf '%q' "$EXAMPLES") test/quick.sh direct --target riscv64 --tier $TIER --out quick-out" \
            2>&1 | tee quick.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Direct PAL, riscv64 (emulated guest)"
            echo '```'
            cat quick-out/summary.txt 2>/dev/null || echo "(no summary: the run did not finish)"
            grep -E ',(fail|known-fail)(,|$)' quick-out/results.csv 2>/dev/null | cut -d, -f5-7 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-direct-riscv64
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            quick-out
            quick.log
            .riscv64-guest/console.log
