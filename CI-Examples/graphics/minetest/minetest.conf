# Default settings for the example: moderate quality and a 60 FPS cap, so that it runs on an
# integrated GPU without loading the whole machine. minetest-max.conf has Tirith's maximum-quality
# settings.
default_game = devtest
server_announce = false
enable_damage = true
creative_mode = false
enable_sound = false
autosave_screensize = false
screen_w = 1280
screen_h = 720

# frame pacing
fps_max = 60
fps_max_unfocused = 20
vsync = false

# rendering
enable_shaders = true
enable_dynamic_shadows = false
fsaa = 0
anisotropic_filter = false
mip_map = true
trilinear_filter = false
bilinear_filter = false
smooth_lighting = true
enable_3d_clouds = false
enable_particles = true
enable_waving_plants = false
enable_waving_leaves = false
enable_waving_water = false
tone_mapping = false
leaves_style = simple
opaque_water = true
viewing_range = 80
performance_tradeoffs = true

# deterministic, light world
fixed_map_seed = 9594414812599699125
static_spawnpoint = 0,5,0
time_speed = 0
max_block_generate_distance = 6
active_block_range = 2
num_emerge_threads = 1
server_map_save_interval = 0
sqlite_synchronous = 0
