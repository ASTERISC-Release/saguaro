// Real-time unattended local workload for initial Gramine enablement.
// A recorded timedemo should replace this for final reproducible measurements.
sv_lan 1
sv_use_steam_networking 0
sv_cheats 1
tf_bot_quota 0
tf_bot_quota_mode normal
tf_bot_difficulty 2
mp_waitingforplayers_cancel 1
mp_autoteambalance 0
mp_teams_unbalance_limit 0
mp_forceautoteam 1
mp_humans_must_join_team blue
mp_idledealmethod 0
mp_timelimit 0
mp_winlimit 0
mp_maxrounds 0
mp_match_end_at_timelimit 0
mp_stalemate_enable 0
mp_enableroundwaittime 0
mp_disable_respawn_times 1
mat_vsync 0
r_lightmap_bicubic 0
fps_max 0
engine_no_focus_sleep 0
cl_showfps 0
net_graph 1
cl_team blue
cl_class soldier
developer 0
con_enable 1
con_logfile "gramine_ready.log"

// Suppress first-run, training, help, and matchmaking panels. These settings
// matter in the VM because its HOME intentionally starts empty.
cl_autohelp 0
cl_showhelp 0
cl_disablehtmlmotd 1
cl_notifications_show_ingame 0
gameinstructor_enable 0
tf_training_has_prompted_for_training 1
tf_training_has_prompted_for_offline_practice 1
tf_training_has_prompted_for_forums 1
tf_training_has_prompted_for_options 1
tf_training_has_prompted_for_loadout 1
tf_find_a_match_hint_viewed 1
tf_casual_welcome_hide 1
tf_comp_welcome_hide 1
tf_coach_request_nevershowagain 1
tf_romevision_skip_prompt 1
tf_quest_map_intro_viewed 1
tf_warpaint_explanation_viewed 1
tf_explanations_backpackpanel 1
tf_explanations_charinfopanel 1
tf_explanations_charinfo_armory_panel 1
tf_explanations_craftingpanel 1
tf_explanations_discardpanel 1
tf_explanations_store 1
tf_show_maps_details_explanation_count 99
tf_show_preset_explanation_in_class_loadout 0
tf_show_taunt_explanation_in_class_loadout 0

// TF2 automatically executes cfg/cp_badlands.cfg after activating the listen
// server. The integration mounts its post-map setup at that path.
map cp_badlands
