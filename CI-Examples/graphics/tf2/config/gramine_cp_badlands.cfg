// Post-map portion of the unattended benchmark workload. This file is copied
// or mounted as cfg/cp_badlands.cfg, which Source executes after map activation.
sv_allow_wait_command 1
mp_waitingforplayers_cancel 1
mp_forceautoteam 1
mp_humans_must_join_team blue
mp_idledealmethod 0
mp_timelimit 0
mp_winlimit 0
mp_maxrounds 0
mp_match_end_at_timelimit 0
mp_stalemate_enable 0
mp_enableroundwaittime 0
mp_disable_respawn_times 1
tf_bot_quota_mode normal
tf_bot_quota 0

// Prevent either team from completing cp_badlands. The event callback reapplies
// the locks after every round activation/reset.
script_execute gramine_lock_points
